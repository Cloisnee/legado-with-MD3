# ============================================================
# TTS-Server 移植构建工作流（手机云编译用）
# 放置位置：fork 仓库的 .github/workflows/build-ttsrv-port.yml
# 前提：仓库根目录已上传 ttsrv-port-overlay.zip
# ============================================================
name: Build TTS-Server Port APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Clear 18PlusList.txt
        run: echo "" > app/src/main/assets/18PlusList.txt

      - name: Check overlay zip
        run: |
          if [ ! -f ttsrv-port-overlay.zip ]; then
            echo "::error::仓库根目录缺少 ttsrv-port-overlay.zip，请先上传（参考 README-CI.md）"
            exit 1
          fi

      - name: Unzip TTS-Server overlay
        run: |
          unzip -o ttsrv-port-overlay.zip -d "$GITHUB_WORKSPACE"
          echo "---- modules ----"
          ls -la modules

      - name: Apply repo patches
        run: python3 apply_patch.py "$GITHUB_WORKSPACE"

      - name: Show changes
        run: |
          git status --porcelain | head -50
          git diff --stat | tail -20

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug -PenableAbiSplits=false --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: ttsrv-${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-ttsrv-${{ github.run_number }}
          path: app/build/outputs/apk/app/debug/*.apk
