pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        gradlePluginPortal()
        // Maven Central 在 CI 会 429；优先走 Google 的 Central 镜像，华为云兜底
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven {
            url = uri("https://jitpack.io")
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        // Maven Central 在 CI 会 429；优先走 Google 的 Central 镜像，华为云兜底
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        mavenCentral()
    }
}
rootProject.name = 'legado'

include ':app'
include ':modules:book'
include ':modules:rhino'
include ':modules:lib-common'
include ':modules:lib-script'
include ':modules:lib-tts'
include ':baselineprofile'
project(':baselineprofile').projectDir = file('baselineProfile')
